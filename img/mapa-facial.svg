<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo luxo púrpura profundo -->
    <radialGradient id="bgGrad" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b1566" />
      <stop offset="45%" stop-color="#210b3b" />
      <stop offset="85%" stop-color="#120620" />
      <stop offset="100%" stop-color="#08020d" />
    </radialGradient>

    <!-- Vinheta da face -->
    <radialGradient id="faceVignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#3b0764" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#120620" stop-opacity="0" />
    </radialGradient>

    <!-- Pele facial suave e natural (sem maquiagem pesada ou aspecto plástico) -->
    <linearGradient id="faceSkinGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FDE8DA" />
      <stop offset="40%" stop-color="#EBBCA1" />
      <stop offset="75%" stop-color="#D79E7E" />
      <stop offset="100%" stop-color="#B26F4F" />
    </linearGradient>

    <filter id="pinShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C084FC" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <style>
      .pin-group { cursor: pointer; transition: transform 0.2s ease; }
      .pin-group:hover circle.pin-circle { fill: #A855F7; stroke: #FDE047; stroke-width: 2.2px; }
      .pin-group:hover text.pin-txt { fill: #FFFFFF; font-weight: 900; }
      .legend-row { cursor: pointer; transition: opacity 0.2s, transform 0.2s; }
      .legend-row:hover rect.legend-bg { fill: rgba(168, 85, 247, 0.28); }
      .legend-row:hover text.legend-txt { fill: #FDE047; font-weight: 800; }
    </style>
  </defs>

  <!-- Fundo Sólido Gradiente -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Elementos Geométricos Romboidais (ID Visual NG Piercing) -->
  <g opacity="0.32">
    <rect x="-35" y="-35" width="125" height="125" rx="14" fill="#9333EA" transform="rotate(35 25 25)" />
    <rect x="40" y="-45" width="95" height="95" rx="10" fill="#7E22CE" transform="rotate(35 85 5)" opacity="0.7" />
    <rect x="-20" y="70" width="85" height="85" rx="10" fill="#A855F7" transform="rotate(35 22 112)" opacity="0.5" />
    <rect x="80" y="45" width="60" height="60" rx="8" fill="#C084FC" transform="rotate(35 110 75)" opacity="0.4" />
  </g>

  <!-- Cabeçalho Oficial do Poster -->
  <g text-anchor="middle">
    <text x="270" y="48" fill="#FFFFFF" font-family="'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="900" letter-spacing="2">LOCAIS PARA</text>
    <text x="270" y="82" fill="#E879F9" font-family="'Montserrat', 'Arial', sans-serif" font-size="34" font-weight="900" letter-spacing="3" filter="url(#glowPurple)">PERFURAÇÃO</text>
    <text x="270" y="108" fill="#FFFFFF" font-family="'Montserrat', 'Arial', sans-serif" font-size="19" font-weight="800" letter-spacing="2">(FACIAL &amp; NASAL)</text>
  </g>

  <!-- Vinheta Circular Suave para a Face -->
  <circle cx="152" cy="295" r="145" fill="url(#faceVignette)" />

  <!-- ========================================================================
       ILUSTRAÇÃO ANATÔMICA FACIAL E NASAL (SEM NENHUM PIERCING)
       ======================================================================== -->
  <g id="facialArtwork" transform="translate(152, 295) scale(0.85)">
    <!-- Base Facial Silhueta Suave -->
    <ellipse cx="0" cy="0" rx="120" ry="145" fill="url(#faceSkinGrad)" opacity="0.75" />

    <!-- Sobrancelhas Naturais -->
    <path d="M -70 -75 C -45 -92, -18 -86, -4 -70" fill="none" stroke="#482212" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 4 -70 C 18 -86, 45 -92, 70 -75" fill="none" stroke="#482212" stroke-width="4.5" stroke-linecap="round" />

    <!-- Olhos Esboçados Sutis (Para Referência Anatômica) -->
    <path d="M -60 -50 C -42 -62, -22 -62, -12 -50 C -22 -44, -42 -44, -60 -50 Z" fill="#260C05" opacity="0.65" />
    <path d="M 12 -50 C 22 -62, 42 -62, 60 -50 C 42 -44, 22 -44, 12 -50 Z" fill="#260C05" opacity="0.65" />

    <!-- Dorso do Nariz e Ponte Nasal -->
    <path d="M 0 -55 L -3 -5 C -4 10, -18 24, -20 28 C -14 36, 14 36, 20 28 C 18 24, 4 10, 3 -5 L 0 -55" 
          fill="none" stroke="#87472A" stroke-width="1.8" opacity="0.6" stroke-linejoin="round" />

    <!-- Ponta e Asas Nasais (Aba Nasal) -->
    <path d="M -20 28 C -28 22, -32 14, -26 4 C -20 4, -16 14, -10 24" fill="none" stroke="#7A391E" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 20 28 C 28 22, 32 14, 26 4 C 20 4, 16 14, 10 24" fill="none" stroke="#7A391E" stroke-width="2.2" stroke-linecap="round" />

    <!-- Narinas e Columela do Septo -->
    <ellipse cx="-9" cy="27" rx="4.5" ry="3.2" fill="#2B0E05" transform="rotate(-15 -9 27)" />
    <ellipse cx="9" cy="27" rx="4.5" ry="3.2" fill="#2B0E05" transform="rotate(15 9 27)" />
    <path d="M -5 29 C 0 32, 0 32, 5 29" fill="none" stroke="#7A391E" stroke-width="2.5" stroke-linecap="round" />

    <!-- Maçã do Rosto (Zigmático) Sombra Delicada -->
    <ellipse cx="55" cy="5" rx="20" ry="12" fill="#D67B62" opacity="0.25" filter="blur(4px)" />

    <!-- Lábios Sutis para Proporção Facial -->
    <path d="M -28 65 C -14 60, 14 60, 28 65 C 14 76, -14 76, -28 65 Z" fill="#BA5A6B" opacity="0.55" />
  </g>

  <!-- ========================================================================
       PINOS NUMERADOS FACIAIS (EXATAMENTE COMO NO PADRÃO DO ESTÚDIO)
       ======================================================================== -->

  <!-- 1 - ABA NASAL (Nostril / Cartilagem Alar Direita) -->
  <g class="pin-group" id="pin-face-1" onclick="filtrarPontoAnatomico('nariz', 'aba-nasal')">
    <circle cx="178" cy="320" r="12" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="178" y="325" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle" class="pin-txt">1</text>
  </g>

  <!-- 2 - SEPTO (Columela Central Inferior) -->
  <g class="pin-group" id="pin-face-2" onclick="filtrarPontoAnatomico('nariz', 'septo')">
    <circle cx="152" cy="330" r="12" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="152" y="335" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle" class="pin-txt">2</text>
  </g>

  <!-- 3 - SOBRANCELHA (Terço Distal da Sobrancelha) -->
  <g class="pin-group" id="pin-face-3" onclick="filtrarPontoAnatomico('faciais', 'sobrancelha')">
    <circle cx="202" cy="225" r="12" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="202" y="230" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle" class="pin-txt">3</text>
  </g>

  <!-- 4 - BRIDGE (Ponte Nasal Entre os Olhos) -->
  <g class="pin-group" id="pin-face-4" onclick="filtrarPontoAnatomico('faciais', 'bridge')">
    <circle cx="152" cy="245" r="12" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="152" y="250" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle" class="pin-txt">4</text>
  </g>

  <!-- 5 - MICRODERMAL (Maçã do Rosto / Zigomático) -->
  <g class="pin-group" id="pin-face-5" onclick="filtrarPontoAnatomico('faciais', 'microdermal')">
    <circle cx="208" cy="295" r="12" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="208" y="300" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle" class="pin-txt">5</text>
  </g>

  <!-- 6 - SURFACE (Têmpora / Pré-auricular) -->
  <g class="pin-group" id="pin-face-6" onclick="filtrarPontoAnatomico('faciais', 'surface')">
    <circle cx="95" cy="295" r="12" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="95" y="300" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle" class="pin-txt">6</text>
  </g>

  <!-- ========================================================================
       COLUNA LATERAL DIREITA: LEGENDA NUMERADA (EXATAMENTE COMO NO POSTER)
       ======================================================================== -->
  <g id="faceLegend" transform="translate(258, 190)">
    <!-- 1 -->
    <g class="legend-row" onclick="filtrarPontoAnatomico('nariz', 'aba-nasal')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">1 - ABA NASAL</text>
    </g>
    <!-- 2 -->
    <g class="legend-row" transform="translate(0, 38)" onclick="filtrarPontoAnatomico('nariz', 'septo')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">2 - SEPTO</text>
    </g>
    <!-- 3 -->
    <g class="legend-row" transform="translate(0, 76)" onclick="filtrarPontoAnatomico('faciais', 'sobrancelha')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">3 - SOBRANCELHA</text>
    </g>
    <!-- 4 -->
    <g class="legend-row" transform="translate(0, 114)" onclick="filtrarPontoAnatomico('faciais', 'bridge')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">4 - BRIDGE</text>
    </g>
    <!-- 5 -->
    <g class="legend-row" transform="translate(0, 152)" onclick="filtrarPontoAnatomico('faciais', 'microdermal')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">5 - MICRODERMAL</text>
    </g>
    <!-- 6 -->
    <g class="legend-row" transform="translate(0, 190)" onclick="filtrarPontoAnatomico('faciais', 'surface')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">6 - SURFACE</text>
    </g>
  </g>

  <!-- Marca D'água Oficial no Rodapé (Dupla: Contorno + Preenchimento) -->
  <g transform="translate(270, 482)" text-anchor="middle">
    <text y="0" fill="none" stroke="#A855F7" stroke-width="1.2" opacity="0.22" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="5">NG PIERCING STUDIO</text>
    <text y="22" fill="#7E22CE" opacity="0.18" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="5">NG PIERCING STUDIO</text>
  </g>
</svg>