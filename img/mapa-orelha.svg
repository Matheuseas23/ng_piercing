    <!-- 1 -->
    <g class="legend-row" onclick="filtrarPontoAnatomico('orelha', 'lobulo')">
      <rect x="0" y="0" width="265" height="24" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="17" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" class="legend-txt">1 - PRIMEIRO FURO LÓBULO</text>
    </g>
    <!-- 2 -->
    <g class="legend-row" transform="translate(0, 27)" onclick="filtrarPontoAnatomico('orelha', 'lobulo')">
