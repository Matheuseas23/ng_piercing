<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo luxo púrpura profundo -->
    <radialGradient id="bgGrad" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b1566" />
      <stop offset="45%" stop-color="#210b3b" />
      <stop offset="85%" stop-color="#120620" />
      <stop offset="100%" stop-color="#08020d" />
    </radialGradient>

    <!-- Brilho suave da vinheta da orelha -->
    <radialGradient id="earVignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#3b0764" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#120620" stop-opacity="0" />
    </radialGradient>

    <!-- Gradientes de pele natural para anatomia da orelha (sem piercings) -->
    <linearGradient id="skinBase" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FCE1D0" />
      <stop offset="35%" stop-color="#EBB394" />
      <stop offset="70%" stop-color="#D78E69" />
      <stop offset="100%" stop-color="#AB5F3C" />
    </linearGradient>

    <linearGradient id="earHelixFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEECE2" />
      <stop offset="40%" stop-color="#F2BA9D" />
      <stop offset="80%" stop-color="#C5754E" />
      <stop offset="100%" stop-color="#8E3C1B" />
    </linearGradient>

    <radialGradient id="earConchInner" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C5754E" />
      <stop offset="50%" stop-color="#8F3C1C" />
      <stop offset="85%" stop-color="#581F0B" />
      <stop offset="100%" stop-color="#381005" />
    </radialGradient>

    <!-- Sombra dos pinos numéricos -->
    <filter id="pinShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Brilho no título PERFURAÇÃO -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C084FC" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <style>
      .pin-group { cursor: pointer; transition: transform 0.2s ease; }
      .pin-group:hover circle.pin-circle { fill: #A855F7; stroke: #FDE047; stroke-width: 2.2px; }
      .pin-group:hover text.pin-txt { fill: #FFFFFF; font-weight: 900; }
      .legend-row { cursor: pointer; transition: opacity 0.2s, transform 0.2s; }
      .legend-row:hover rect.legend-bg { fill: rgba(168, 85, 247, 0.28); }
      .legend-row:hover text.legend-txt { fill: #FDE047; font-weight: 800; }
    </style>
  </defs>

  <!-- Fundo Sólido Gradiente -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Elementos Geométricos Romboidais (Canto Superior Esquerdo - ID Visual NG Piercing) -->
  <g opacity="0.32">
    <rect x="-35" y="-35" width="125" height="125" rx="14" fill="#9333EA" transform="rotate(35 25 25)" />
    <rect x="40" y="-45" width="95" height="95" rx="10" fill="#7E22CE" transform="rotate(35 85 5)" opacity="0.7" />
    <rect x="-20" y="70" width="85" height="85" rx="10" fill="#A855F7" transform="rotate(35 22 112)" opacity="0.5" />
    <rect x="80" y="45" width="60" height="60" rx="8" fill="#C084FC" transform="rotate(35 110 75)" opacity="0.4" />
  </g>

  <!-- Cabeçalho Oficial do Poster -->
  <g text-anchor="middle">
    <text x="270" y="48" fill="#FFFFFF" font-family="'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="900" letter-spacing="2">LOCAIS PARA</text>
    <text x="270" y="82" fill="#E879F9" font-family="'Montserrat', 'Arial', sans-serif" font-size="34" font-weight="900" letter-spacing="3" filter="url(#glowPurple)">PERFURAÇÃO</text>
    <text x="270" y="108" fill="#FFFFFF" font-family="'Montserrat', 'Arial', sans-serif" font-size="19" font-weight="800" letter-spacing="2">(ORELHA)</text>
  </g>

  <!-- Vinheta Circular Suave para a Orelha -->
  <circle cx="152" cy="305" r="145" fill="url(#earVignette)" />

  <!-- ========================================================================
       ILUSTRAÇÃO ANATÔMICA REALISTA DA ORELHA HUMANA (SEM NENHUM PIERCING)
       ======================================================================== -->
  <g id="earAnatomyArtwork" transform="translate(152, 305) scale(0.72)">
    <!-- Orelha Exterior / Silhueta Completa -->
    <path d="M 40 -210
             C -60 -215, -145 -145, -155 -55
             C -165 30, -135 105, -130 155
             C -125 215, -85 275, -20 280
             C 45 285, 95 240, 105 180
             C 115 110, 140 -20, 105 -120
             C 90 -165, 70 -205, 40 -210 Z" 
          fill="url(#skinBase)" stroke="#74381C" stroke-width="2.5" />

    <!-- Dobra da Hélix Superior e Escafa -->
    <path d="M 40 -195
             C -35 -195, -110 -140, -115 -65
             C -120 10, -100 85, -95 130
             C -90 170, -60 215, -15 220
             C 25 225, 65 195, 75 145
             C 85 90, 105 -15, 80 -105
             C 70 -145, 55 -190, 40 -195 Z" 
          fill="url(#earHelixFold)" opacity="0.85" />

    <!-- Fossa Triangular / Concha Superior -->
    <path d="M 15 -155
             C -30 -150, -75 -105, -75 -45
             C -75 5, -55 45, -45 85
             C -35 130, -10 160, 25 150
             C 55 140, 65 95, 60 45
             C 55 -15, 55 -85, 40 -125
             C 35 -145, 25 -155, 15 -155 Z" 
          fill="#DB8E68" opacity="0.7" />

    <!-- Concha Auricular Profunda & Entrada do Canal Auditivo -->
    <path d="M -15 -45
             C -55 -30, -70 15, -65 65
             C -60 115, -30 145, 10 145
             C 45 145, 60 115, 55 65
             C 50 15, 25 -25, -15 -45 Z" 
          fill="url(#earConchInner)" />

    <!-- Meato Acústico Externo (Centro Escuro) -->
    <ellipse cx="-20" cy="50" rx="18" ry="24" fill="#200A03" opacity="0.9" />

    <!-- Tragus (Aba protetora cartilaginosa triangular anterior) -->
    <path d="M -115 35
             C -130 50, -130 80, -112 95
             C -95 110, -75 88, -75 68
             C -75 48, -98 30, -115 35 Z" 
          fill="url(#skinBase)" stroke="#74381C" stroke-width="2" />

    <!-- Anti-Tragus & Incisura Intertrágica -->
    <path d="M -70 120 C -55 145, -25 155, 5 140" fill="none" stroke="#682E15" stroke-width="3" stroke-linecap="round" />

    <!-- Crus Helicis (Raiz da Hélix / Curvatura Daith) -->
    <path d="M -70 -20 C -40 -30, 0 -25, 20 5" fill="none" stroke="#5C2513" stroke-width="3.5" stroke-linecap="round" />

    <!-- Anti-Hélix Pilar e Curvatura Rook -->
    <path d="M -40 -100 C -15 -105, 10 -80, 5 -45" fill="none" stroke="#7A391E" stroke-width="3" stroke-linecap="round" />
    
    <!-- Lóbulo: Vinco e Sombra de Volume Carnudo -->
    <path d="M -65 175 C -35 220, 15 225, 60 190" fill="none" stroke="#8A4222" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- ========================================================================
       PINOS NUMERADOS DIRETAMENTE NA ANATOMIA (EXATAMENTE COMO NO POSTER)
       ======================================================================== -->
  
  <!-- 1 - PRIMEIRO FURO LÓBULO -->
