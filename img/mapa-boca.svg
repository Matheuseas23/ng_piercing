<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo luxo púrpura profundo -->
    <radialGradient id="bgGrad" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b1566" />
      <stop offset="45%" stop-color="#210b3b" />
      <stop offset="85%" stop-color="#120620" />
      <stop offset="100%" stop-color="#08020d" />
    </radialGradient>

    <!-- Vinhetas dos círculos de foco anatômico -->
    <radialGradient id="mouthCircle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#3b0764" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#120620" stop-opacity="0" />
    </radialGradient>

    <!-- Gradientes de lábios naturais sem piercing -->
    <linearGradient id="lipUpperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9777F" />
      <stop offset="50%" stop-color="#BA5663" />
      <stop offset="100%" stop-color="#883340" />
    </linearGradient>

    <linearGradient id="lipLowerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA8E97" />
      <stop offset="40%" stop-color="#D46A78" />
      <stop offset="100%" stop-color="#943949" />
    </linearGradient>

    <radialGradient id="skinFaceMouth" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDE8DA" />
      <stop offset="60%" stop-color="#EBBCA1" />
      <stop offset="100%" stop-color="#C98B6C" />
    </radialGradient>

    <!-- Gradiente da Língua -->
    <radialGradient id="tongueGrad" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#EA7B8A" />
      <stop offset="55%" stop-color="#CF5869" />
      <stop offset="85%" stop-color="#9E3545" />
      <stop offset="100%" stop-color="#5A1521" />
    </radialGradient>

    <filter id="pinShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C084FC" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <clipPath id="circleMouthClip">
      <circle cx="152" cy="225" r="72" />
    </clipPath>

    <clipPath id="circleTongueClip">
      <circle cx="152" cy="370" r="58" />
    </clipPath>

    <style>
      .pin-group { cursor: pointer; transition: transform 0.2s ease; }
      .pin-group:hover circle.pin-circle { fill: #A855F7; stroke: #FDE047; stroke-width: 2.2px; }
      .pin-group:hover text.pin-txt { fill: #FFFFFF; font-weight: 900; }
      .legend-row { cursor: pointer; transition: opacity 0.2s, transform 0.2s; }
      .legend-row:hover rect.legend-bg { fill: rgba(168, 85, 247, 0.28); }
      .legend-row:hover text.legend-txt { fill: #FDE047; font-weight: 800; }
    </style>
  </defs>

  <!-- Fundo Sólido Gradiente -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Elementos Geométricos Romboidais (ID Visual NG Piercing) -->
  <g opacity="0.32">
    <rect x="-35" y="-35" width="125" height="125" rx="14" fill="#9333EA" transform="rotate(35 25 25)" />
    <rect x="40" y="-45" width="95" height="95" rx="10" fill="#7E22CE" transform="rotate(35 85 5)" opacity="0.7" />
    <rect x="-20" y="70" width="85" height="85" rx="10" fill="#A855F7" transform="rotate(35 22 112)" opacity="0.5" />
    <rect x="80" y="45" width="60" height="60" rx="8" fill="#C084FC" transform="rotate(35 110 75)" opacity="0.4" />
  </g>

  <!-- Cabeçalho Oficial do Poster -->
  <g text-anchor="middle">
    <text x="270" y="48" fill="#FFFFFF" font-family="'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="900" letter-spacing="2">LOCAIS PARA</text>
    <text x="270" y="82" fill="#E879F9" font-family="'Montserrat', 'Arial', sans-serif" font-size="34" font-weight="900" letter-spacing="3" filter="url(#glowPurple)">PERFURAÇÃO</text>
    <text x="270" y="108" fill="#FFFFFF" font-family="'Montserrat', 'Arial', sans-serif" font-size="19" font-weight="800" letter-spacing="2">(BOCA)</text>
  </g>

  <!-- ========================================================================
       CÍRCULO SUPERIOR 1: LÁBIOS E REGIÃO PERIORAL (SEM PIERCING)
       ======================================================================== -->
  <!-- Brilho ao redor do círculo -->
  <circle cx="152" cy="225" r="76" fill="url(#mouthCircle)" />
  <circle cx="152" cy="225" r="72" fill="#1A0A26" stroke="#9333EA" stroke-width="1.8" stroke-opacity="0.6"/>

  <g clip-path="url(#circleMouthClip)">
    <!-- Base de pele do rosto ao redor da boca -->
    <rect x="70" y="145" width="165" height="160" fill="url(#skinFaceMouth)" />
    
    <!-- Filtro Labial / Philtrum (Sulco do Arco do Cupido) -->
    <path d="M 142 165 C 145 180, 147 195, 147 205" fill="none" stroke="#B87758" stroke-width="2.5" opacity="0.4" />
    <path d="M 162 165 C 159 180, 157 195, 157 205" fill="none" stroke="#B87758" stroke-width="2.5" opacity="0.4" />

    <!-- Lábio Superior Realista -->
    <path d="M 98 222
             C 120 208, 138 200, 152 208
             C 166 200, 184 208, 206 222
             C 186 225, 166 228, 152 225
             C 138 228, 118 225, 98 222 Z" 
          fill="url(#lipUpperGrad)" stroke="#74222E" stroke-width="1.2" />

    <!-- Abertura sutil da boca -->
    <path d="M 98 222 C 125 227, 179 227, 206 222 C 179 224, 125 224, 98 222 Z" fill="#380910" />

    <!-- Lábio Inferior Plump com Volume -->
    <path d="M 98 222
             C 122 226, 138 226, 152 225
             C 166 226, 182 226, 206 222
             C 192 250, 170 258, 152 258
             C 134 258, 112 250, 98 222 Z" 
          fill="url(#lipLowerGrad)" stroke="#74222E" stroke-width="1.2" />

    <!-- Brilho Labial Natural -->
    <path d="M 138 238 C 146 242, 158 242, 166 238 C 158 240, 146 240, 138 238 Z" fill="#FFFFFF" opacity="0.38" filter="blur(0.8px)" />

    <!-- Sulco do Mento (Queixo) -->
    <path d="M 132 272 C 144 278, 160 278, 172 272" fill="none" stroke="#A86A4C" stroke-width="2.5" opacity="0.3" stroke-linecap="round" />
  </g>

  <!-- Pinos Numéricos na Boca (Exatamente como na Imagem 2 de Referência) -->
  <!-- 4 - MADONNA (Superior Direito) -->
  <g class="pin-group" id="pin-boca-4" onclick="filtrarPontoAnatomico('boca', 'madonna')">
    <circle cx="112" cy="198" r="11" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="112" y="202" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" class="pin-txt">4</text>
  </g>

  <!-- 6 - MEDUSA (Filtro Superior Central) -->
  <g class="pin-group" id="pin-boca-6" onclick="filtrarPontoAnatomico('boca', 'medusa')">
    <circle cx="152" cy="192" r="11" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="152" y="196" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" class="pin-txt">6</text>
  </g>

  <!-- 5 - MONROE (Superior Esquerdo) -->
  <g class="pin-group" id="pin-boca-5" onclick="filtrarPontoAnatomico('boca', 'monroe')">
    <circle cx="192" cy="198" r="11" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="192" y="202" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" class="pin-txt">5</text>
  </g>

  <!-- 1 - LABRET LATERAL (Inferior Direito) -->
  <g class="pin-group" id="pin-boca-1" onclick="filtrarPontoAnatomico('boca', 'labret-lateral')">
    <circle cx="106" cy="245" r="11" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="106" y="249" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" class="pin-txt">1</text>
  </g>

  <!-- 3 - ASHLEY (Lábio Vermelho Central Inferior) -->
  <g class="pin-group" id="pin-boca-3" onclick="filtrarPontoAnatomico('boca', 'vertical-labret')">
    <circle cx="152" cy="240" r="11" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="152" y="244" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" class="pin-txt">3</text>
  </g>

  <!-- 2 - LABRET LATERAL (Inferior Esquerdo) -->
  <g class="pin-group" id="pin-boca-2" onclick="filtrarPontoAnatomico('boca', 'labret-lateral')">
    <circle cx="198" cy="245" r="11" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="198" y="249" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" class="pin-txt">2</text>
  </g>

  <!-- ========================================================================
       CÍRCULO INFERIOR 2: LÍNGUA (SEM PIERCING)
       ======================================================================== -->
  <circle cx="152" cy="370" r="62" fill="url(#mouthCircle)" />
  <circle cx="152" cy="370" r="58" fill="#1A0A26" stroke="#9333EA" stroke-width="1.8" stroke-opacity="0.6"/>

  <g clip-path="url(#circleTongueClip)">
    <!-- Fundo escuro da cavidade oral -->
    <rect x="90" y="310" width="125" height="120" fill="#24060C" />

    <!-- Língua Projetada -->
    <path d="M 112 330
             C 112 360, 118 410, 142 418
             C 152 422, 152 422, 162 418
             C 186 410, 192 360, 192 330
             C 192 320, 112 320, 112 330 Z" 
          fill="url(#tongueGrad)" stroke="#6A1825" stroke-width="1.5" />

    <!-- Sulco Mediano da Língua -->
    <path d="M 152 335 L 152 410" fill="none" stroke="#681522" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />
    <!-- Textura Papilas Gustativas sutis -->
    <circle cx="140" cy="360" r="1.5" fill="#FFA5B2" opacity="0.4" />
    <circle cx="164" cy="365" r="1.5" fill="#FFA5B2" opacity="0.4" />
    <circle cx="145" cy="385" r="1.5" fill="#FFA5B2" opacity="0.4" />
    <circle cx="159" cy="390" r="1.5" fill="#FFA5B2" opacity="0.4" />
  </g>

  <!-- 7 - LÍNGUA (Centro da Língua) -->
  <g class="pin-group" id="pin-boca-7" onclick="filtrarPontoAnatomico('boca', 'lingua')">
    <circle cx="152" cy="372" r="11" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#pinShadow)" class="pin-circle"/>
    <text x="152" y="376" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" class="pin-txt">7</text>
  </g>

  <!-- ========================================================================
       COLUNA LATERAL DIREITA: LEGENDA NUMERADA (EXATAMENTE COMO NO POSTER)
       ======================================================================== -->
  <g id="mouthLegend" transform="translate(258, 175)">
    <!-- 1 -->
    <g class="legend-row" onclick="filtrarPontoAnatomico('boca', 'labret-lateral')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">1 - LABRET LATERAL</text>
    </g>
    <!-- 2 -->
    <g class="legend-row" transform="translate(0, 36)" onclick="filtrarPontoAnatomico('boca', 'labret-lateral')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">2 - LABRET LATERAL</text>
    </g>
    <!-- 3 -->
    <g class="legend-row" transform="translate(0, 72)" onclick="filtrarPontoAnatomico('boca', 'vertical-labret')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">3 - ASHLEY</text>
    </g>
    <!-- 4 -->
    <g class="legend-row" transform="translate(0, 108)" onclick="filtrarPontoAnatomico('boca', 'madonna')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">4 - MADONNA</text>
    </g>
    <!-- 5 -->
    <g class="legend-row" transform="translate(0, 144)" onclick="filtrarPontoAnatomico('boca', 'monroe')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">5 - MONROE</text>
    </g>
    <!-- 6 -->
    <g class="legend-row" transform="translate(0, 180)" onclick="filtrarPontoAnatomico('boca', 'medusa')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">6 - MEDUSA</text>
    </g>
    <!-- 7 -->
    <g class="legend-row" transform="translate(0, 216)" onclick="filtrarPontoAnatomico('boca', 'lingua')">
      <rect x="0" y="0" width="265" height="28" rx="4" fill="transparent" class="legend-bg" />
      <text x="8" y="19" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" class="legend-txt">7 - LINGUA</text>
    </g>
  </g>

  <!-- Marca D'água Oficial no Rodapé (Dupla: Contorno + Preenchimento) -->
  <g transform="translate(270, 482)" text-anchor="middle">
    <text y="0" fill="none" stroke="#A855F7" stroke-width="1.2" opacity="0.22" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="5">NG PIERCING STUDIO</text>
    <text y="22" fill="#7E22CE" opacity="0.18" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="5">NG PIERCING STUDIO</text>
  </g>
</svg>