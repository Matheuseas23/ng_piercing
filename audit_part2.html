<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Auditoria de Imagens - Parte 2</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #222; border-radius: 8px; padding: 12px; border: 1px solid #444; }
    .card img { width: 100%; height: 260px; object-fit: contain; background: #fff; border-radius: 4px; display: block; }
    .key { font-weight: bold; color: #f0a500; font-size: 14px; margin-top: 8px; word-break: break-all; }
    .hash { font-size: 11px; color: #888; word-break: break-all; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Auditoria de Imagens - Parte 2 (Cards 30 a 39)</h1>
  <div id="grid" class="grid"></div>

  <script src="js/products.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const entries = Object.entries(IMAGENS_LOJA_PIERCING).slice(29);
    entries.forEach(([key, url], idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + (idx + 30);
      card.innerHTML = `
        <img src="${url}" alt="${key}" />
        <div class="key">${idx + 30}. ${key}</div>
        <div class="hash">${url.split('/').pop()}</div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
